<html lang="en">
  <head>

    <meta name="twitter:image" content="https://sciconshooter.xyz/preview.png" />

    <title>Scicon Shooter</title>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Orbitron';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/orbitron-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Orbitron';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/orbitron-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Orbitron';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('/fonts/orbitron-latin.woff2') format('woff2');
      }
      
      :root {
        --app-visual-height: 100dvh;
        --app-safe-bottom: env(safe-area-inset-bottom, 0px);
        --app-bottom-buffer: max(1rem, calc(var(--app-safe-bottom) + 1rem));
      }

      html {
        height: 100%;
        background: #0b1020;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: #0b1020;
        font-family: 'Inter', sans-serif;
        touch-action: none; /* Prevent pull-to-refresh on mobile */
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: var(--app-visual-height);
      }
      
      /* --- LAYOUT FIXES FOR VERCEL --- */
      #root {
        position: relative;
        width: min(100vw, 430px);
        height: 100vh;
        height: 100dvh;
        height: var(--app-visual-height);
        max-height: 932px;
        overflow: hidden;
        background: #0b1020;
        box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.16), 0 24px 90px rgba(0, 0, 0, 0.58);
      }

      @media (max-width: 430px) {
        #root {
          max-height: none;
          box-shadow: none;
        }
      }

      @media (min-width: 900px) {
        #root {
          width: 100vw;
          max-width: none;
          max-height: none;
          box-shadow: none;
        }
      }

      @media (display-mode: standalone), (display-mode: fullscreen) {
        :root {
          --app-bottom-buffer: max(2.25rem, calc(var(--app-safe-bottom) + 1.5rem));
        }
      }

      @media (display-mode: standalone) and (max-width: 640px), (display-mode: fullscreen) and (max-width: 640px) {
        #root .scicon-start-screen {
          min-height: var(--app-visual-height);
          height: 100%;
          overscroll-behavior: contain;
        }

        #root .scicon-start-shell {
          min-height: var(--app-visual-height);
          padding-bottom: var(--app-bottom-buffer);
        }

        #root .scicon-mobile-main {
          min-height: calc(var(--app-visual-height) - var(--app-bottom-buffer) - 1rem);
          padding-bottom: var(--app-bottom-buffer);
          scroll-padding-bottom: var(--app-bottom-buffer);
        }
      }

      /* Ensures the game background sits behind everything */
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Ensures the React UI sits ON TOP of the game */
      #root > div {
        position: relative;
        z-index: 10;
        height: 100%;
        width: 100%;
      }
      /* ------------------------------- */

      h1, h2, h3, .arcade-font {
        font-family: 'Orbitron', sans-serif;
      }

      .scicon-logo-lockup {
        --chrome-top: #ffffff;
        --chrome-mid: #e6edf8;
        --chrome-cut: #a9b8cf;
        --chrome-blue: rgba(96, 165, 250, 0.82);
        --chrome-pink: rgba(244, 114, 182, 0.56);
        display: inline-grid;
        gap: 0;
        max-width: min(100%, 20rem);
        transform: skewX(-7deg);
        filter:
          drop-shadow(0 12px 18px rgba(0, 0, 0, 0.46))
          drop-shadow(0 0 18px rgba(96, 165, 250, 0.18));
      }

      .scicon-logo-word {
        position: relative;
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: visible;
        color: #f8fbff;
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(2.35rem, 12.5vw, 4.65rem);
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0.055em;
        line-height: 0.8;
        text-transform: uppercase;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.92) 44%, transparent 58%) -160% 0 / 48% 100% no-repeat;
        -webkit-text-fill-color: #f8fbff;
        -webkit-text-stroke: 1.25px rgba(255, 255, 255, 0.98);
        animation: scicon-logo-shine 5.8s ease-in-out infinite;
        text-shadow:
          0 0 1px rgba(255, 255, 255, 0.95),
          1px 1px 0 rgba(203, 213, 225, 0.95),
          2px 2px 0 rgba(51, 65, 85, 0.95),
          3px 3px 0 rgba(3, 7, 18, 0.98),
          -1px -1px 0 var(--chrome-blue),
          1px 2px 0 var(--chrome-pink),
          0 -1px 0 rgba(255, 255, 255, 0.95),
          0 0 14px rgba(219, 234, 254, 0.38);
      }

      .scicon-logo-word::before,
      .scicon-logo-word::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scicon-logo-word::before {
        z-index: -1;
        color: #020617;
        -webkit-text-fill-color: #020617;
        -webkit-text-stroke: 6px #020617;
        text-shadow:
          1px 0 0 rgba(34, 211, 238, 0.58),
          -1px 0 0 rgba(244, 114, 182, 0.42),
          0 0 12px rgba(15, 23, 42, 0.95);
      }

      .scicon-logo-word::after {
        z-index: 1;
        color: transparent;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0 18%, transparent 30% 58%, rgba(148, 163, 184, 0.22) 68% 100%),
          linear-gradient(90deg, rgba(191, 219, 254, 0.42), transparent 18% 82%, rgba(248, 113, 113, 0.22));
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0;
      }

      .scicon-logo-word--sub {
        margin-top: 0.06em;
        font-size: clamp(2.1rem, 11vw, 4.25rem);
        letter-spacing: 0.045em;
      }

      .scicon-logo-lockup--dashboard {
        max-width: 100%;
      }

      .scicon-logo-lockup--dashboard .scicon-logo-word {
        font-size: clamp(2.15rem, 10vw, 3.85rem);
      }

      .scicon-logo-lockup--dashboard .scicon-logo-word--sub {
        font-size: clamp(1.95rem, 9.2vw, 3.45rem);
      }

      @media (min-width: 900px) {
        .scicon-logo-lockup--dashboard .scicon-logo-word {
          font-size: clamp(2.05rem, 3.8vw, 3.2rem);
        }

        .scicon-logo-lockup--dashboard .scicon-logo-word--sub {
          font-size: clamp(1.85rem, 3.4vw, 2.9rem);
        }
      }

      @keyframes scicon-logo-shine {
        0%, 62%, 100% {
          background-position: -180% 0, 0 0;
        }
        76% {
          background-position: 220% 0, 0 0;
        }
      }

      /* Custom scrollbar for modals */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a2035; 
      }
      ::-webkit-scrollbar-thumb {
        background: #6c63ff; 
        border-radius: 4px;
      }

      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* --- SCICON CARD SYSTEM --- */
      .scicon-card {
        position: relative;
        background: #000000;
        clip-path: polygon(
          14px 0, 100% 0,
          100% calc(100% - 14px), calc(100% - 14px) 100%,
          0 100%, 0 14px
        );
      }

      .scicon-border-container {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, rgba(34, 211, 238, 0.75), rgba(99, 102, 241, 0.2) 42%, rgba(250, 204, 21, 0.5));
        z-index: -1;
        clip-path: polygon(
          18px 0, 100% 0,
          100% calc(100% - 18px), calc(100% - 18px) 100%,
          0 100%, 0 18px
        );
        opacity: 0.72;
      }
      
      /* Electric Pulse Animation */
      @keyframes electric-pulse {
        0% { 
          filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.6));
        }
        50% { 
          filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.8)) drop-shadow(0 0 15px rgba(99, 102, 241, 0.6));
        }
        100% { 
          filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.6));
        }
      }

      .scicon-electric-border {
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.9), rgba(99, 102, 241, 0.55), rgba(16, 185, 129, 0.75)) !important;
        animation: electric-pulse 3s infinite ease-in-out;
      }
      
      /* Blue Glow Pulse for Referral Button */
      @keyframes blue-glow-pulse {
        0%, 100% { 
          filter: drop-shadow(0 0 2px rgba(92, 92, 255, 0.5));
        }
        50% { 
          filter: drop-shadow(0 0 8px rgba(92, 92, 255, 0.9)) drop-shadow(0 0 12px rgba(92, 92, 255, 0.6));
        }
      }
      
      .blue-glow-animate {
        animation: blue-glow-pulse 2s infinite ease-in-out;
      }

      @keyframes scicon-talk {
        0%, 100% { transform: translate(0, 0) scale(1); filter: saturate(1.1); }
        20% { transform: translate(-1px, 1px) scale(1.015); }
        40% { transform: translate(1px, -1px) scale(1.02); filter: saturate(1.35); }
        60% { transform: translate(1px, 1px) scale(1.01); }
        80% { transform: translate(-1px, -1px) scale(1.018); }
      }

      .scicon-talk-portrait {
        animation: scicon-talk 0.16s steps(2, end) infinite;
      }

      .scicon-inner-bg {
         position: absolute;
         inset: 1px;
         background:
          linear-gradient(180deg, rgba(5, 12, 24, 0.96), rgba(2, 6, 18, 0.92)),
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 42%);
         clip-path: polygon(
          17px 0, 100% 0,
          100% calc(100% - 17px), calc(100% - 17px) 100%,
          0 100%, 0 17px
        );
      }

      .scicon-node {
        display: none;
      }

      .node-tl-1 { top: -4px; left: 16px; }
      .node-tl-2 { top: 16px; left: -4px; }
      .node-tr-1 { top: -4px; right: 16px; }
      .node-tr-2 { top: 16px; right: -4px; }
      .node-bl-1 { bottom: -4px; left: 16px; }
      .node-bl-2 { bottom: 16px; left: -4px; }
      .node-br-1 { bottom: -4px; right: 16px; }
      .node-br-2 { bottom: 16px; right: -4px; }

      /* Buttons */
      .scicon-btn {
        position: relative;
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border: none;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        transition: all 0.2s ease;
        text-transform: uppercase;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 0.1em;
      }
      .scicon-btn:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
        box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
      }
      .scicon-btn:active {
        transform: scale(0.98);
      }
      .scicon-btn-secondary {
        background: transparent;
        border: 1px solid #4b5563;
      }
      .scicon-btn-secondary:hover {
        background: rgba(255,255,255,0.05);
      }

      .rh-nav-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        padding: 9px 12px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.04em;
        transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      }

      .rh-nav-button:hover {
        transform: translateY(-1px);
        background: #dbeafe;
        border-color: rgba(96, 165, 250, 0.55);
      }

      .scicon-hero-title {
        display: grid;
        justify-items: center;
        gap: 0.02em;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        line-height: 0.9;
        text-transform: uppercase;
        color: #f8fbff;
        text-shadow:
          0 0 2px rgba(255, 255, 255, 0.95),
          0 0 18px rgba(34, 211, 238, 0.82),
          0 7px 0 rgba(15, 23, 42, 0.94),
          0 14px 28px rgba(8, 145, 178, 0.5);
      }

      .scicon-hero-title span {
        position: relative;
        display: block;
        background:
          linear-gradient(180deg, #ffffff 0%, #dbeafe 18%, #67e8f9 42%, #0ea5e9 64%, #e0f2fe 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 1px rgba(226, 232, 240, 0.75);
      }

      .scicon-hero-title span::before,
      .scicon-hero-title span::after {
        content: "";
        position: absolute;
        top: 45%;
        height: 8px;
        width: min(13vw, 74px);
        transform: translateY(-50%) skewX(-28deg);
        background: linear-gradient(90deg, rgba(250, 204, 21, 0), rgba(250, 204, 21, 0.95), rgba(250, 204, 21, 0));
        filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.55));
      }

      .scicon-hero-title span::before {
        right: calc(100% + 0.18em);
      }

      .scicon-hero-title span::after {
        left: calc(100% + 0.18em);
      }

      .sci-icon-button {
        display: inline-flex;
        height: 42px;
        width: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(103, 232, 249, 0.24);
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.66);
        color: rgba(207, 250, 254, 0.92);
        box-shadow: inset 0 0 14px rgba(34, 211, 238, 0.08);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
      }

      .sci-icon-button:hover {
        transform: translateY(-1px);
        border-color: rgba(110, 231, 183, 0.68);
        background: rgba(16, 185, 129, 0.14);
        color: #ffffff;
      }

      .sci-start-button {
        position: relative;
        border: 1px solid rgba(110, 231, 183, 0.72);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(52, 211, 153, 0.9), rgba(5, 150, 105, 0.9)),
          linear-gradient(90deg, rgba(6, 78, 59, 0.96), rgba(21, 128, 61, 0.96));
        clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        box-shadow:
          inset 0 0 18px rgba(255, 255, 255, 0.18),
          0 0 24px rgba(52, 211, 153, 0.45);
        transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      }

      .sci-start-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
        box-shadow:
          inset 0 0 22px rgba(255, 255, 255, 0.22),
          0 0 34px rgba(52, 211, 153, 0.68);
      }

      .sci-ship-orbit {
        position: absolute;
        bottom: 18px;
        width: min(84%, 360px);
        height: 110px;
        border: 1px solid rgba(103, 232, 249, 0.24);
        border-radius: 50%;
        background:
          radial-gradient(ellipse at center, rgba(34, 211, 238, 0.22), rgba(15, 23, 42, 0.06) 52%, transparent 70%);
        transform: perspective(430px) rotateX(64deg);
        box-shadow:
          0 0 30px rgba(34, 211, 238, 0.25),
          inset 0 0 22px rgba(16, 185, 129, 0.18);
      }

      .sci-ship-orbit::before,
      .sci-ship-orbit::after {
        content: "";
        position: absolute;
        inset: 18px 36px;
        border: 1px solid rgba(110, 231, 183, 0.22);
        border-radius: 50%;
      }

      .sci-ship-orbit::after {
        inset: 34px 78px;
        border-color: rgba(250, 204, 21, 0.2);
      }

      .sci-rh-ship {
        position: relative;
        z-index: 2;
        width: min(66vw, 421px);
        height: 227px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.72));
      }

      .sci-rh-ship--compact {
        width: min(54vw, 242px);
        height: 133px;
      }

      .sci-rh-ship::before,
      .sci-rh-ship::after {
        content: "";
        position: absolute;
        left: 50%;
        border-radius: 50%;
        transform: translateX(-50%) perspective(420px) rotateX(64deg);
      }

      .sci-rh-ship::before {
        bottom: 14px;
        width: 88%;
        height: 58px;
        border: 1px solid rgba(103, 232, 249, 0.42);
        background:
          radial-gradient(ellipse at center, rgba(34, 211, 238, 0.24), rgba(15, 23, 42, 0.04) 52%, transparent 70%);
        box-shadow:
          0 0 22px rgba(34, 211, 238, 0.25),
          inset 0 0 20px rgba(16, 185, 129, 0.2);
        animation: sci-rh-ring-pulse 2.8s ease-in-out infinite;
      }

      .sci-rh-ship::after {
        bottom: 20px;
        width: 52%;
        height: 42px;
        background:
          radial-gradient(ellipse at center, rgba(34, 211, 238, 0.7), rgba(16, 185, 129, 0.2) 42%, transparent 72%);
        filter: blur(10px);
        animation: sci-rh-glow-pulse 2.15s ease-in-out infinite;
      }

      .sci-rh-ship-core {
        position: relative;
        z-index: 3;
        display: flex;
        width: 64%;
        aspect-ratio: 1;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: radial-gradient(circle at 50% 48%, rgba(34, 211, 238, 0.18), transparent 68%);
        animation: sci-rh-logo-float 3.2s ease-in-out infinite;
      }

      .sci-rh-ship-core::before {
        content: "";
        position: absolute;
        inset: 6%;
        z-index: -1;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(110, 231, 183, 0.24), rgba(34, 211, 238, 0.08) 58%, transparent 72%);
        filter: blur(10px);
      }

      .sci-rh-ship-core img {
        width: 118%;
        height: 118%;
        object-fit: contain;
        transform: scale(1.08);
        filter:
          drop-shadow(0 0 10px rgba(34, 211, 238, 0.82))
          drop-shadow(0 0 22px rgba(52, 211, 153, 0.45));
      }

      @keyframes sci-rh-ring-pulse {
        0%, 100% {
          opacity: 0.65;
          transform: translateX(-50%) perspective(420px) rotateX(64deg) scale(0.96);
        }
        50% {
          opacity: 1;
          transform: translateX(-50%) perspective(420px) rotateX(64deg) scale(1.04);
        }
      }

      @keyframes sci-rh-glow-pulse {
        0%, 100% {
          opacity: 0.42;
          transform: translateX(-50%) perspective(420px) rotateX(64deg) scale(0.86);
        }
        50% {
          opacity: 0.95;
          transform: translateX(-50%) perspective(420px) rotateX(64deg) scale(1.08);
        }
      }

      @keyframes sci-rh-logo-float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      .sci-weekly-winner-card {
        box-shadow:
          inset 0 0 22px rgba(20, 184, 166, 0.1),
          0 0 24px rgba(16, 185, 129, 0.12);
      }

      .sci-weekly-winner-card::before {
        content: "";
        position: absolute;
        inset: -45%;
        background: conic-gradient(from 90deg, transparent, rgba(34, 211, 238, 0.22), transparent 28%, rgba(110, 231, 183, 0.2), transparent 58%);
        opacity: 0.42;
        animation: sci-weekly-orbit 7.5s linear infinite;
      }

      .sci-weekly-scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 0%, transparent 38%, rgba(125, 249, 255, 0.18) 48%, transparent 58%, transparent 100%);
        transform: translateX(-125%);
        animation: sci-weekly-scan 3.8s ease-in-out infinite;
      }

      .sci-weekly-project-image {
        box-shadow:
          inset 0 0 18px rgba(34, 211, 238, 0.14),
          0 0 20px rgba(34, 211, 238, 0.16);
      }

      .sci-weekly-project-image::before {
        content: "";
        position: absolute;
        inset: 8px;
        z-index: 1;
        border: 1px solid rgba(110, 231, 183, 0.34);
        border-radius: 8px;
        opacity: 0.68;
        animation: sci-weekly-frame-pulse 2.6s ease-in-out infinite;
      }

      .sci-weekly-live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #6ee7b7;
        box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.65);
        animation: sci-weekly-live-pulse 1.7s ease-in-out infinite;
      }

      @keyframes sci-weekly-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes sci-weekly-scan {
        0%, 45% {
          transform: translateX(-125%);
        }
        78%, 100% {
          transform: translateX(125%);
        }
      }

      @keyframes sci-weekly-frame-pulse {
        0%, 100% {
          opacity: 0.42;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }

      @keyframes sci-weekly-live-pulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.65);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(110, 231, 183, 0);
        }
      }

      .sci-dashboard-nav {
        background:
          linear-gradient(90deg, rgba(6, 78, 59, 0.25), transparent 24%, rgba(14, 165, 233, 0.12) 64%, rgba(2, 6, 23, 0.9)),
          rgba(2, 6, 23, 0.88);
      }

      .sci-mini-cta {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(103, 232, 249, 0.24);
        border-radius: 8px;
        background: rgba(34, 211, 238, 0.08);
        color: #cffafe;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 800;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .sci-mini-cta:hover {
        transform: translateY(-1px);
        border-color: rgba(110, 231, 183, 0.55);
        background: rgba(16, 185, 129, 0.14);
      }

      .sci-market-card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 14px;
        min-height: 112px;
        border: 1px solid rgba(103, 232, 249, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        padding: 18px;
        text-align: left;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .sci-market-card:hover {
        transform: translateY(-1px);
        border-color: rgba(110, 231, 183, 0.52);
        background: rgba(20, 184, 166, 0.1);
      }

      .sci-market-card strong,
      .sci-market-card small {
        display: block;
      }

      .sci-market-card strong {
        color: #ffffff;
        font-size: 16px;
      }

      .sci-market-card small {
        margin-top: 4px;
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.35;
      }

      @media (max-width: 640px) {
        .tw-modal {
          top: calc(env(safe-area-inset-top) + 12px) !important;
          right: 10px !important;
          bottom: auto !important;
          left: 10px !important;
          width: auto !important;
          max-width: none !important;
          max-height: calc(100dvh - env(safe-area-inset-top) - 24px) !important;
          border-radius: 22px !important;
          overflow: hidden !important;
        }

        .tw-modal [data-scrolly="true"] {
          max-height: calc(100dvh - env(safe-area-inset-top) - 26px) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const setVisualViewportHeight = () => {
          const viewport = window.visualViewport;
          const height = viewport?.height || window.innerHeight || document.documentElement.clientHeight;
          document.documentElement.style.setProperty('--app-visual-height', `${Math.max(1, Math.round(height))}px`);
        };

        setVisualViewportHeight();
        window.addEventListener('resize', setVisualViewportHeight, { passive: true });
        window.visualViewport?.addEventListener('resize', setVisualViewportHeight, { passive: true });
        window.visualViewport?.addEventListener('scroll', setVisualViewportHeight, { passive: true });
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
